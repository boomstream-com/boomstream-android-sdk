[versions]
# NOTE: Architecture doc targets AGP 9.2.0 + Kotlin 2.1.21 (built-in via AGP 9.x).
# Current build uses AGP 8.x + separate kotlin-android plugin — bump to 9.x in a dedicated
# migration issue (requires build script changes: remove kotlin-android plugin, new compileOptions).
agp                  = "8.2.2"
kotlin               = "2.4.0"
coroutines           = "1.10.1"
serialization        = "1.7.3"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
retrofitKotlinxJson  = "1.0.0"
dokka                = "2.0.0"
junit                = "4.13.2"
mockito              = "5.14.2"
androidCore          = "1.13.1"
activityCompose      = "1.9.0"
# player-sdk additions
media3               = "1.4.1"
# offline-sdk additions
securityCrypto       = "1.1.0-alpha06"
coil                 = "2.6.0"
composeBom           = "2024.06.00"
# composeCompiler removed — K2 compose plugin (kotlin-compose) version tracks kotlin version
lifecycle            = "2.8.7"

[libraries]
kotlin-stdlib          = { module = "org.jetbrains.kotlin:kotlin-stdlib",                                  version.ref = "kotlin" }
coroutines-core        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",                       version.ref = "coroutines" }
coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",                    version.ref = "coroutines" }
coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",                       version.ref = "coroutines" }
serialization-json     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",                    version.ref = "serialization" }
retrofit               = { module = "com.squareup.retrofit2:retrofit",                                     version.ref = "retrofit" }
okhttp                 = { module = "com.squareup.okhttp3:okhttp",                                         version.ref = "okhttp" }
mockwebserver          = { module = "com.squareup.okhttp3:mockwebserver",                                  version.ref = "okhttp" }
retrofit-kotlinx-json  = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter",  version.ref = "retrofitKotlinxJson" }
android-core           = { module = "androidx.core:core-ktx",                                              version.ref = "androidCore" }
activity-compose       = { module = "androidx.activity:activity-compose",                                  version.ref = "activityCompose" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",                        version.ref = "lifecycle" }
junit                  = { module = "junit:junit",                                                         version.ref = "junit" }
mockito-core           = { module = "org.mockito:mockito-core",                                            version.ref = "mockito" }
# player-sdk: Media3
media3-exoplayer         = { module = "androidx.media3:media3-exoplayer",          version.ref = "media3" }
media3-exoplayer-hls     = { module = "androidx.media3:media3-exoplayer-hls",      version.ref = "media3" }
media3-datasource        = { module = "androidx.media3:media3-datasource",         version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp",  version.ref = "media3" }
media3-ui                = { module = "androidx.media3:media3-ui",                 version.ref = "media3" }
# player-sdk: Compose (version pinned via BOM at runtime)
compose-bom              = { module = "androidx.compose:compose-bom",              version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui" }
compose-foundation       = { module = "androidx.compose.foundation:foundation" }
compose-material3        = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# player-sdk: image loading
coil                     = { module = "io.coil-kt:coil",                            version.ref = "coil" }
coil-compose             = { module = "io.coil-kt:coil-compose",                    version.ref = "coil" }
# offline-sdk: EncryptedSharedPreferences for keyset persistence (CSO constraint #3 )
security-crypto          = { module = "androidx.security:security-crypto",          version.ref = "securityCrypto" }

[plugins]
android-library      = { id = "com.android.library",                          version.ref = "agp" }
android-application  = { id = "com.android.application",                      version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                 version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",    version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
dokka                = { id = "org.jetbrains.dokka",                           version.ref = "dokka" }
