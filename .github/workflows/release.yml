name: Release to Maven Central

# Publishes api-sdk / player-sdk / offline-sdk to Maven Central (Sonatype Central
# Portal) on a version tag. Mirrors the Gradle staging + signing setup; the actual
# release is triggered only by pushing a tag like v1.0.0.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign and stage all modules
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          BOOMSTREAM_API_KEY: ""
          # Gradle gates signing on a non-empty tag marker; provide the GitHub tag.
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew publishAllPublicationsToStagingRepository \
            -Pboomstream.sdk.version="${{ steps.ver.outputs.version }}" --no-daemon
          find build/staging-deploy -type f | sort

      - name: Verify every artifact is GPG-signed
        run: |
          ASC=$(find build/staging-deploy -name '*.asc' | wc -l | tr -d ' ')
          ART=$(find build/staging-deploy -type f \
            ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' \
            ! -name '*.sha256' ! -name '*.sha512' | wc -l | tr -d ' ')
          echo "signed=$ASC artifacts=$ART"
          if [ "$ASC" -eq 0 ] || [ "$ASC" -ne "$ART" ]; then
            echo "Signature count mismatch — aborting before upload."
            exit 1
          fi

      - name: Bundle staging tree
        run: |
          cd build/staging-deploy && zip -r ../../central-bundle.zip . && cd ../..
          echo "bundle: $(du -sh central-bundle.zip | cut -f1)"

      - name: Upload bundle to Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          RESP=$(curl -f -s -u "${CENTRAL_TOKEN_USERNAME}:${CENTRAL_TOKEN_PASSWORD}" \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")
          echo "deployment id: ${RESP}"
          echo "DEPLOYMENT_ID=$(echo "${RESP}" | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Wait for PUBLISHED
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          for i in $(seq 1 60); do
            S=$(curl -s -u "${CENTRAL_TOKEN_USERNAME}:${CENTRAL_TOKEN_PASSWORD}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('deploymentState',''))" 2>/dev/null || echo "")
            echo "[$i/60] deploymentState=$S"
            case "$S" in
              PUBLISHED) echo "Published to Maven Central"; exit 0 ;;
              FAILED|FAILED_VALIDATION) echo "Central publication failed"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "Timed out waiting for PUBLISHED"; exit 1

      - name: Save bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: central-bundle.zip
          if-no-files-found: ignore
