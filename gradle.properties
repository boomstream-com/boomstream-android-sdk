android.useAndroidX=true
android.enableJetifier=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# Development snapshot version — MUST end in -SNAPSHOT on develop.
# publish-central overrides this via -Pboomstream.sdk.version=${CI_COMMIT_TAG#v}
# so release tags still publish the clean semver (e.g. v1.0.0 → 1.0.0 to Central).
# Bump the base version here when preparing a new release cycle.
boomstream.sdk.version=1.3.0
